services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* é embutida no build; mudar exige rebuild
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    # container_name fixo: é o nome usado em SABLIER_SERVICES
    container_name: nextjs-base
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      WEB_URI: ${WEB_URI}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # secret do JWT do next-auth (obrigatório; diferente de ENCRYPTION_KEY)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?defina NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EMAIL: ${EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-email-smtp.us-east-1.amazonaws.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MYAPP: ${MYAPP:-Base Project}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dokploy-network
    labels:
      # O router fica no Traefik em arquivo (gerado pelo Sablier, campo "domain" de SABLIER_SERVICES),
      # para existir mesmo com o container parado e mostrar a tela de espera em vez de 404.
      - traefik.enable=false

networks:
  dokploy-network:
    external: true
